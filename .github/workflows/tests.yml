name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      # allocator.py importeert niets van Home Assistant, dus de suite draait
      # zonder de rest van HA erbij te installeren.
      - run: python -m pytest tests/ -q
